name: Deploy Kong Gateway to Konnect

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deck-deploy:
    runs-on: ubuntu-latest
    
    env:
      DECK_KONNECT_TOKEN: ${{ secrets.DECK_KONNECT_TOKEN }}
      DECK_KONNECT_CONTROL_PLANE_NAME: "quickstart"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup decK
        uses: kong/setup-deck@v1
        with:
          deck-version: '1.39.3'

      # Step A: Validate structural rules and preview diff changes
      - name: Validate and Check Configuration Diff
        run: |
          deck gateway diff kong-gateway/

      # Step B: Sync execution (Changed 'apply' to 'sync' for this decK version)
      - name: Sync Configuration to Konnect
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          deck gateway sync kong-gateway/
