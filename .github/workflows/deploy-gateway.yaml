name: Deploy Kong Gateway to Konnect

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deck-deploy:
    runs-on: ubuntu-latest
    
    env:
      DECK_KONNECT_TOKEN: ${{ secrets.DECK_KONNECT_TOKEN }}
      DECK_KONNECT_CONTROL_PLANE_NAME: "quickstart"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup decK
        uses: kong/setup-deck@v1
        with:
          deck-version: '1.39.3'

      # FIX: Added offline structural validation flag to prevent Konnect mode errors
      - name: Validate Gateway Configuration Structure
        run: |
          deck gateway validate kong-gateway/ --online-validation=false

      # Step B: Dry-run comparison (This checks remote rules safely)
      - name: Check Configuration Diff
        run: |
          deck gateway diff kong-gateway/

      # Step C: Sync execution
      - name: Sync Configuration to Konnect
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          deck gateway apply kong-gateway/
